<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-label="ghost-qa terminal session: the 5-Trap Engine audits a localhost app on desktop and mobile, catches a React hydration error, a 500 API route and mobile overflow, and emits a Self-Healing Bug Report">
  <title>ghost-qa — 5-Trap Engine terminal demo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2330"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="6" y="6" width="1228" height="888" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M6 22 a16 16 0 0 1 16 -16 h1196 a16 16 0 0 1 16 16 v34 h-1228 z" fill="url(#bar)"/>
  <line x1="6" y1="62" x2="1234" y2="62" stroke="#30363d" stroke-width="1"/>
  <circle cx="34" cy="34" r="8" fill="#ff5f57"/>
  <circle cx="62" cy="34" r="8" fill="#febc2e"/>
  <circle cx="90" cy="34" r="8" fill="#28c840"/>
  <text x="620" y="41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">ghost-qa — autonomous browser verification — zsh</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" xml:space="preserve">
    <!-- command -->
    <text x="36" y="108"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3" dx="12">npx -y ghost-qa test http://localhost:3000</tspan></text>

    <!-- header -->
    <text x="36" y="152"><tspan fill="#e6edf3" font-weight="bold">👻 ghost-qa v1.3.0</tspan><tspan fill="#8b949e"> — autonomous browser verification</tspan></text>
    <text x="36" y="184" fill="#8b949e">Target: <tspan fill="#79c0ff">http://localhost:3000/</tspan>  ·  Duration: 8.4s  ·  Depth: 2  ·  Safe interactions</text>

    <!-- viewports -->
    <text x="36" y="228" fill="#8b949e">Viewports:</text>
    <rect x="176" y="206" width="268" height="30" rx="7" fill="#12261a" stroke="#238636"/>
    <text x="192" y="228" font-size="17"><tspan fill="#3fb950">▣ DESKTOP </tspan><tspan fill="#8b949e"> 1440×900</tspan></text>
    <rect x="460" y="206" width="292" height="30" rx="7" fill="#12261a" stroke="#238636"/>
    <text x="476" y="228" font-size="17"><tspan fill="#3fb950">▣ MOBILE </tspan><tspan fill="#8b949e"> 390×844 iPhone</tspan></text>

    <!-- 5-trap engine table -->
    <text x="36" y="278" fill="#e6edf3" font-weight="bold">5-TRAP ENGINE</text>
    <text x="610" y="278" fill="#8b949e">DESKTOP</text>
    <text x="850" y="278" fill="#8b949e">MOBILE</text>
    <line x1="36" y1="292" x2="1040" y2="292" stroke="#21262d"/>

    <text x="36" y="322" fill="#c9d1d9">Console trap</text>
    <text x="250" y="322" fill="#8b949e">hydration, page errors</text>
    <text x="610" y="322" fill="#f85149">✖ 1 critical</text>
    <text x="850" y="322" fill="#3fb950">✔ clean</text>

    <text x="36" y="354" fill="#c9d1d9">Network trap</text>
    <text x="250" y="354" fill="#8b949e">4xx/5xx, CORS, assets</text>
    <text x="610" y="354" fill="#3fb950">✔ clean</text>
    <text x="850" y="354" fill="#f85149">✖ 1 critical</text>

    <text x="36" y="386" fill="#c9d1d9">Layout trap</text>
    <text x="250" y="386" fill="#8b949e">overflow, 0×0 targets</text>
    <text x="610" y="386" fill="#3fb950">✔ clean</text>
    <text x="850" y="386" fill="#d29922">▲ 1 major</text>

    <text x="36" y="418" fill="#c9d1d9">A11y trap</text>
    <text x="250" y="418" fill="#8b949e">names, alt, labels, lang</text>
    <text x="610" y="418" fill="#3fb950">✔ clean</text>
    <text x="850" y="418" fill="#3fb950">✔ clean</text>

    <text x="36" y="450" fill="#c9d1d9">Perf trap</text>
    <text x="250" y="450" fill="#8b949e">load budget, payload, jank</text>
    <text x="610" y="450" fill="#3fb950">✔ clean</text>
    <text x="850" y="450" fill="#3fb950">✔ clean</text>

    <!-- routes -->
    <text x="36" y="498"><tspan fill="#e6edf3" font-weight="bold">Routes crawled</tspan><tspan fill="#8b949e">   3 routes · 26 interactions · 21 passed · 1 failed · 4 skipped (safety)</tspan></text>
    <text x="36" y="530"><tspan fill="#79c0ff">/</tspan><tspan fill="#8b949e"> [200] 3 issues</tspan><tspan fill="#79c0ff" dx="40">/pricing</tspan><tspan fill="#3fb950"> [200] ✔</tspan><tspan fill="#79c0ff" dx="40">/dashboard</tspan><tspan fill="#8b949e"> [200] 2 issues</tspan></text>

    <!-- failures -->
    <text x="36" y="578"><tspan fill="#e6edf3" font-weight="bold">Failures caught</tspan><tspan fill="#8b949e">   5 total — 2 critical · 3 major · 0 minor</tspan></text>
    <text x="36" y="612"><tspan fill="#f85149">✖ CRITICAL [console] </tspan><tspan fill="#e6edf3">React hydration mismatch: Text content did not match…</tspan></text>
    <text x="56" y="642" fill="#8b949e">↳ / · desktop · <tspan fill="#d2a8ff">#a91f03cc</tspan></text>
    <text x="36" y="674"><tspan fill="#f85149">✖ CRITICAL [network] </tspan><tspan fill="#e6edf3">Server error HTTP 500 for /api/users — API is crashing</tspan></text>
    <text x="56" y="704" fill="#8b949e">↳ /dashboard · mobile · <tspan fill="#d2a8ff">#51bd77e0</tspan></text>
    <text x="36" y="736"><tspan fill="#d29922">▲ MAJOR [layout] </tspan><tspan fill="#e6edf3">Horizontal overflow: page scrolls sideways by 130px</tspan></text>
    <text x="56" y="766" fill="#8b949e">↳ / · mobile · <tspan fill="#d2a8ff">#c04d19aa</tspan></text>

    <!-- self-healing report -->
    <rect x="28" y="788" width="1184" height="88" rx="10" fill="#0f1f16" stroke="#238636"/>
    <text x="48" y="822"><tspan fill="#3fb950" font-weight="bold">Self-Healing Bug Report</tspan><tspan fill="#c9d1d9"> → ghost-qa-report.md · per-issue fix playbook by #id</tspan></text>
    <text x="48" y="856"><tspan fill="#f85149">✖ GHOST-QA FAIL</tspan><tspan fill="#8b949e"> — agent fixes #a91f03cc #51bd77e0 #c04d19aa, re-runs → </tspan><tspan fill="#3fb950">✔ PASS</tspan></text>
  </g>
</svg>

<text x="24" y="68"><tspan class="dollar">$</tspan></text>
<g clip-path="url(#clip1)"><text class="cmd" x="42" y="68" xml:space="preserve">npx -y ghost-qa@latest test http://localhost:3000</text></g>
<text class="caret" x="474" y="68" fill="#3fb950">▌</text>
<text class="a0" x="24" y="92" xml:space="preserve"><tspan class="ink">👻 ghost-qa 2.1.0 — 8-Trap Engine · 3 viewports × light/dark · 12 routes</tspan></text>
<text class="a1" x="24" y="118" xml:space="preserve"><tspan class="mut">Crawling routes · tapping 43 controls · watching console + network…</tspan></text>
<text class="a2" x="24" y="144" xml:space="preserve"><tspan class="red">✗ </tspan><tspan class="org">[layout · mobile 375×812] horizontal-overflow — div.hero &gt; img.banner (512 &gt; 375)</tspan></text>
<text class="a3" x="24" y="170" xml:space="preserve"><tspan class="red">✗ </tspan><tspan class="org">[layout · mobile 375×812] small-touch-target — button.cta is 82×32px, needs 44×44</tspan></text>
<text class="a4" x="24" y="196" xml:space="preserve"><tspan class="red">✗ </tspan><tspan class="org">[theme · dark] theme-contrast — p.muted on #121212 is 1.8:1, needs 4.5:1</tspan></text>
<text class="a5" x="24" y="222" xml:space="preserve"><tspan class="red">✗ </tspan><tspan class="org">[console] hydration-mismatch — &lt;div&gt; inside &lt;p&gt; (React #418)</tspan></text>
<text class="a6" x="24" y="248" xml:space="preserve"><tspan class="red">✗ </tspan><tspan class="org">[network] http-error — GET /api/products → 500 Internal Server Error</tspan></text>
<text class="a7" x="24" y="276" xml:space="preserve"><tspan class="mut">QA Health Score  </tspan><tspan class="red">38/100  F</tspan></text>
<text class="a8" x="24" y="304" xml:space="preserve"><tspan class="blu">→ Self-Healing Bug Report handed to your coding agent — applying SKILL.md playbooks…</tspan></text>
<text class="a9" x="24" y="330" xml:space="preserve"><tspan class="grn">✓ </tspan><tspan class="ink">Playbook A · min-w-0 + max-w-full → horizontal overflow gone</tspan></text>
<text class="a10" x="24" y="356" xml:space="preserve"><tspan class="grn">✓ </tspan><tspan class="ink">Playbook C · min-h-11 min-w-11 md:min-h-9 → every target ≥ 44×44px</tspan></text>
<text class="a11" x="24" y="382" xml:space="preserve"><tspan class="grn">✓ </tspan><tspan class="ink">Playbooks D+E · dark: theme tokens + deterministic render → parity</tspan></text>
<text class="a12" x="24" y="436" xml:space="preserve"><tspan class="grn">✓ all 8 traps silent — console · network · layout · a11y · perf · links · seo · theme</tspan></text>
<text class="a13" x="24" y="464" xml:space="preserve"><tspan class="mut">QA Health Score  </tspan><tspan class="grn">100/100  A+</tspan></text>
<text class="a14" x="24" y="492" xml:space="preserve"><tspan class="yel">★ Caught a bug before deploy? Star Ghost-QA → github.com/avivgerz-hue/ghost-qa</tspan></text>
<text class="a15" x="24" y="520" xml:space="preserve"><tspan class="grn">PASS ✔  done in 6.4s</tspan></text>

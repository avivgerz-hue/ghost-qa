<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 548" width="920" height="548" role="img" aria-label="Animated ghost-qa terminal demo">
<title>ghost-qa — live terminal demo: 38/100 F → 100/100 A+</title>
<desc>Pure-CSS animated terminal recording. ghost-qa audits a local app with its 8-Trap Engine, catches layout, theme, hydration and network bugs, the coding agent fixes them with the SKILL.md playbooks, and the re-run scores 100/100 A+ in 6.4 seconds.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14.5px}
.ink{fill:#c9d1d9}.mut{fill:#8b949e}.red{fill:#f85149}.grn{fill:#3fb950}
.blu{fill:#58a6ff}.yel{fill:#e3b341}.org{fill:#e8a15c}.cmd{fill:#e6edf3}.dollar{fill:#3fb950;font-weight:700}
.barbg{fill:#21262d}.bar{transform-box:fill-box;transform-origin:left center}
@keyframes stage{0%,94%{opacity:1}97.5%,100%{opacity:0}}
.stage{animation:stage 16s linear infinite}
@keyframes caret{1.88%{opacity:1}4.06%{opacity:0}6.25%{opacity:1}8.44%{opacity:0}10.62%{opacity:1}12.81%{opacity:0}15.00%{opacity:1}15.5%,100%{opacity:0}}
@keyframes type1{0%,2.19%{width:0px}14.37%,100%{width:462px}}
@keyframes type2{0%,65.94%{width:0px}70.62%,100%{width:500px}}

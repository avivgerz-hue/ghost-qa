.type1{animation:type1 16s steps(46,end) infinite}
.type2{animation:type2 16s steps(48,end) infinite}
.caret{animation:caret 16s linear infinite}
.bar1{animation:bar1 16s ease-out infinite}
.bar2{animation:bar2 16s ease-out infinite}
